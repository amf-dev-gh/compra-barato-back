spring.application.name=consum-scraping
server.port=8080

# Eureka Client
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.hostname=consum-scraping

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Configuracion de Playwright
playwright.headless=true
playwright.timeout=30000
playwright.user-agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36
playwright.viewport.width=1920
playwright.viewport.height=1080
playwright.delay.min=2000
playwright.delay.max=5000

# Configuracion de logging
logging.level.com.scraper=DEBUG
logging.level.org.springframework.web=INFO

# Configuracion para evitar deteccion
scraper.max-retries=3
scraper.wait-for-selector-timeout=10000
scraper.cookie-acceptance-timeout=5000