spring.application.name=carrefour-scraping
server.port=0

# Configuraci�n de Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.instance-id=${spring.application.name}:${random.value}
eureka.instance.prefer-ip-address=true

# Configuraci�n de Playwright
playwright.headless=true
playwright.timeout=30000
playwright.user-agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36
playwright.viewport.width=1920
playwright.viewport.height=1080
playwright.delay.min=2000
playwright.delay.max=5000

# Configuraci�n de logging
logging.level.com.scraper=DEBUG
logging.level.org.springframework.web=INFO

# Configuraci�n para evitar detecci�n
scraper.max-retries=3
scraper.wait-for-selector-timeout=15000
scraper.cookie-acceptance-timeout=5000