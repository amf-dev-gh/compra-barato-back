spring.application.name=api-gateway
server.port=8080

# Eureka configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# Feign configuration
feign.client.config.default.connect-timeout=5000
feign.client.config.default.read-timeout=10000

# Logging
logging.level.com.tupackage.clients=DEBUG
logging.level.feign=DEBUG

# Actuator Configuration - Puerto separado para seguridad
management.server.port=8090
management.endpoints.web.exposure.include=health,info,metrics,gateway,routes,circuitbreakers,refresh
management.endpoint.health.show-details=always
management.endpoint.routes.enabled=true

# Gateway Actuator endpoints espec�ficos
management.endpoint.gateway.enabled=true
management.endpoints.web.path-mapping.gateway=gateway

# Security para Actuator (b�sica)
management.endpoints.web.base-path=/actuator
management.security.enabled=false